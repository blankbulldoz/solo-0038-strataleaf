# StrataLeaf constrained-container profile.
#
# This file is the single source of truth for the drills and for the image.
# It is parsed by deploy/container/strataleaf_ops.py (stdlib only) and is
# intentionally boring: KEY=value, "#" comments, no shell evaluation.
#
# Run as an unprivileged uid/gid (never uid 0). The image builds the account
# to match these numbers so a bind-mounted data volume can be chowned once.

STRATALEAF_UID=9042
STRATALEAF_GID=9042
STRATALEAF_USER=strataleaf

# Absolute in-container paths. Both must be separate persistent volume mounts;
# neither may be tmpfs, overlay-writable-layer or a network share (NFS/CIFS/9p/
# SMB/FUSE). The data volume holds the main file plus -wal and -shm.
STRATALEAF_DATA_DIR=/var/lib/strataleaf
STRATALEAF_STATE_DIR=/var/run/strataleaf
STRATALEAF_DB_NAME=strataleaf.db

# Startup gates. A service is only "started" once all of these pass.
# Writable space must stay above these floors after the free-space reserve.
STRATALEAF_MIN_FREE_BYTES=268435456
STRATALEAF_MIN_FREE_PERCENT=10
# Worst-case SQLite transaction footprint used for the preflight check:
# the WAL is allowed to reach this fraction of total volume size.
STRATALEAF_MAX_WAL_PERCENT=25
# Busy timeout for all SQLite handles, in seconds.
STRATALEAF_BUSY_TIMEOUT=5.0

# Shutdown sequence (see deploy/systemd/strataleaf.service ExecStop).
# Stop accepting new work, drain in-flight batches up to the drain budget,
# roll back anything still in flight, then release pins/consumers last.
STRATALEAF_DRAIN_SECONDS=20
STRATALEAF_STOP_TIMEOUT_SECONDS=45
# After this deadline the supervisor sends SIGKILL; recovery must still work
# from WAL, but any commit that had not returned to its caller is unproven.
STRATALEAF_KILL_GRACE_SECONDS=5

# Exit codes used by strataleaf_ops.py (documented in docs/container-runbook.md)
STRATALEAF_EXIT_OK=0
STRATALEAF_EXIT_USAGE=64
STRATALEAF_EXIT_PRECHECK=78
STRATALEAF_EXIT_DRAIN_TIMEOUT=75
STRATALEAF_EXIT_INTERNAL=70
